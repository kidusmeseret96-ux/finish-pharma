<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="48" y1="32" x2="464" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#ECFDF5" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A7A4B" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#D68E18" stop-opacity="0.32" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="16" y1="8" x2="64" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A7A4B" />
      <stop offset="100%" stop-color="#064E31" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="20" y1="74" x2="78" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D68E18" />
      <stop offset="48%" stop-color="#F8C759" />
      <stop offset="100%" stop-color="#E19C24" />
    </linearGradient>
    <linearGradient id="leafDarkGrad" x1="36" y1="40" x2="76" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#129947" />
      <stop offset="100%" stop-color="#075E34" />
    </linearGradient>
    <linearGradient id="leafLightGrad" x1="36" y1="26" x2="74" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#65E043" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>
  </defs>

  <!-- Crisp rounded app tile backdrop so the YOYA login emblem stands out on dark & light Windows taskbars -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="10" />

  <!-- Exact YOYA Login Page Emblem (YoyaPharmacyEmblem) -->
  <g transform="translate(54, 78) scale(4.2)">
    <!-- Rounded Pharmacy Cross -->
    <path
      d="M34 11C34 8.79 35.79 7 38 7H50C52.21 7 54 8.79 54 11V23H66C68.21 23 70 24.79 70 27V39C70 41.21 68.21 43 66 43H54V55C54 57.21 52.21 59 50 59H38C35.79 59 34 57.21 34 55V43H22C19.79 43 18 41.21 18 39V27C18 24.79 19.79 23 22 23H34V11Z"
      fill="url(#crossGrad)"
    />

    <!-- Sweeping Two-Tone Botanical Leaf -->
    <path
      d="M44.5 69.5C41.8 57.2 49.4 39.8 75.5 31.5C69.2 40.2 58.6 52.8 46.8 69.2C46 70.3 44.8 70.3 44.5 69.5Z"
      fill="url(#leafLightGrad)"
    />
    <path
      d="M48.5 70.8C58.8 55.6 69.8 42.5 77.6 33.4C79.4 55.8 68.2 72.2 49.5 72.5C48.2 72.5 47.8 71.8 48.5 70.8Z"
      fill="url(#leafDarkGrad)"
    />

    <!-- Sweeping Golden Crescent Swoosh -->
    <path
      d="M21 59.5C29.5 76.2 49.2 76.8 61.5 66.2C47.8 79.4 26.8 76.4 23.2 57.2C21.6 48.8 29.8 39.4 45.2 31.8C57.6 25.8 69.5 23.5 78.2 26.8C68.2 21.8 54.5 23.5 41.2 30.2C24.5 38.6 15.8 49.5 21 59.5Z"
      fill="url(#goldGrad)"
    />
  </g>
</svg>
