name: Build YOYA Pharmacy Windows App (.exe)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Type-check TypeScript
        run: npm run lint

      - name: Build frontend bundle (dist/)
        run: npm run build

      - name: Bundle production backend server (dist-server/server.mjs)
        run: npm run build:server

      - name: Install Electron packager tools (CI only)
        run: npm install --no-save --legacy-peer-deps electron@35.1.5 electron-builder@26.0.12

      - name: Embed Cloud Sync config from GitHub Secrets (if configured)
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          VENDOR_CLOUDFLARE_URL: ${{ secrets.VENDOR_CLOUDFLARE_URL }}
          VENDOR_SYNC_SECRET: ${{ secrets.VENDOR_SYNC_SECRET }}
        run: |
          $lines = @()
          foreach ($k in @('SUPABASE_URL','SUPABASE_SERVICE_ROLE_KEY','SESSION_SECRET','VENDOR_CLOUDFLARE_URL','VENDOR_SYNC_SECRET')) {
            $v = [Environment]::GetEnvironmentVariable($k)
            if ($v) { $lines += "$k=$v" }
          }
          if ($lines.Count -gt 0) {
            Set-Content -Path "electron/runtime.env" -Value ($lines -join "`n") -Encoding UTF8
            Write-Host "Embedded $($lines.Count) cloud sync variables into desktop build."
          } else {
            Write-Host "No GitHub Secrets configured; .exe will use local storage unless .env is placed in AppData."
          }

      - name: Package Windows Installer & Portable .exe with YOYA logo
        run: npx electron-builder --win --publish never

      - name: Verify generated .exe artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Path release -Filter *.exe | Select-Object Name, Length

      - name: Upload Windows .exe installers as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YOYA-Pharmacy-Windows-EXE
          path: |
            release/*.exe
          if-no-files-found: error

      - name: Attach .exe to GitHub Release (when pushing a v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
